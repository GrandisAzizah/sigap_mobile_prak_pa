name: MyApp
description: "Aplikasi pelaporan kerusakan fasilitas kampus"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  supabase_flutter: ^2.18.3
  flutter_dotenv: ^6.0.1
  get: ^4.7.3
  geolocator: ^14.1.2
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  # Turunkan versi ke 22.x, hindari persyaratan ketat Flutter 3.44 / compileSdk 37
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - .env
    - assets/images/
  uses-material-design: true
